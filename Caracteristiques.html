<script>

'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
{

}
).addTo(map);

// Ajouter un marqueur
L.marker([48.8566, 2.3522])
.addTo(map)
.bindPopup("Paris")
.openPopup();

</script>
